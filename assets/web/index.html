<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="referrer" content="no-referrer">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'; connect-src 'self'; form-action 'self'; base-uri 'none'">
  <title>导入播放列表</title>
  <style>
    :root { color-scheme: light; font-family: system-ui, -apple-system, "Noto Sans SC", sans-serif; }
    * { box-sizing: border-box; }
    body { margin: 0; padding: 24px 16px; background: #f4f6f9; color: #18212f; }
    main { max-width: 520px; margin: 6vh auto 0; padding: 24px; background: #fff; border-radius: 16px; box-shadow: 0 8px 28px rgba(20, 35, 55, .09); }
    h1 { margin: 0 0 10px; font-size: 24px; }
    p { margin: 8px 0 18px; color: #596579; line-height: 1.6; }
    label { display: block; margin: 18px 0 8px; font-weight: 600; }
    input { width: 100%; min-height: 48px; padding: 12px; border: 1px solid #c7cfda; border-radius: 9px; font-size: 16px; }
    button { width: 100%; min-height: 48px; margin-top: 16px; border: 0; border-radius: 9px; background: #1769e0; color: #fff; font-size: 16px; font-weight: 700; }
    button:disabled { opacity: .6; }
    #message { min-height: 24px; margin-top: 14px; font-size: 14px; }
    .note { margin-top: 18px; font-size: 13px; color: #727d8e; }
  </style>
</head>
<body>
  <main>
    <h1>导入播放列表</h1>
    <p>在电视端生成二维码后，用手机打开此页。请手动粘贴 M3U、TXT（含 #genre#）或 XSPF 播放列表链接。</p>
    <form id="importForm">
      <label for="playlistUrl">播放列表链接</label>
      <input id="playlistUrl" name="playlistUrl" type="url" inputmode="url" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="https://…" required>
      <button id="submitButton" type="submit">导入到电视</button>
    </form>
    <div id="message" role="status" aria-live="polite"></div>
    <p class="note">导入后会替换电视当前保存的订阅链接。链接、下载的播放列表和设置都保存在电视本机，不提交到云端；此页面仅提供播放列表导入。</p>
  </main>
  <script>
    (function () {
      var form = document.getElementById('importForm');
      var input = document.getElementById('playlistUrl');
      var button = document.getElementById('submitButton');
      var message = document.getElementById('message');
      form.addEventListener('submit', function (event) {
        event.preventDefault();
        var url = input.value.trim();
        if (!url) {
          message.textContent = '请先粘贴播放列表链接。';
          return;
        }
        button.disabled = true;
        message.textContent = '正在提交…';
        var request = new XMLHttpRequest();
        request.open('POST', '/api/playlist', true);
        request.setRequestHeader('Content-Type', 'application/json; charset=utf-8');
        request.onreadystatechange = function () {
          if (request.readyState !== 4) return;
          button.disabled = false;
          var result = null;
          try { result = JSON.parse(request.responseText); } catch (_) {}
          if (request.status >= 200 && request.status < 300 && result && result.ok) {
            message.textContent = result.message || '已导入。';
            input.value = '';
            button.disabled = true;
          } else {
            message.textContent = result && result.message ? result.message : '提交失败，请检查链接或重新扫码。';
          }
        };
        request.onerror = function () {
          button.disabled = false;
          message.textContent = '无法连接电视，请确认手机和电视连接同一 Wi-Fi。';
        };
        request.send(JSON.stringify({ url: url }));
      });
    }());
  </script>
</body>
</html>
