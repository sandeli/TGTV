name: Build Android APK

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  build-android:
    name: Test and build Android APK
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - name: Check out default branch
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter 3.19.6
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.19.6'
          cache: true

      - name: Resolve dependencies
        run: flutter pub get

      - name: Run tests
        run: flutter test

      - name: Analyze Dart code
        run: flutter analyze

      - name: Build release APK
        run: flutter build apk --release --split-per-abi

      - name: Verify package ID in split APK manifests
        env:
          EXPECTED_PACKAGE: com.sandeli.tgtv
        run: |
          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-}}"
          if [ -z "$SDK_ROOT" ]; then
            echo "Android SDK path is not set" >&2
            exit 1
          fi
          AAPT="$(find "$SDK_ROOT/build-tools" -type f -name aapt -print | sort -V | tail -n 1)"
          if [ -z "$AAPT" ]; then
            echo "Android build-tools aapt not found" >&2
            exit 1
          fi
          shopt -s nullglob
          APKS=(build/app/outputs/flutter-apk/*-release.apk)
          if [ "${#APKS[@]}" -lt 2 ]; then
            echo "Expected at least two ABI-split APKs, found ${#APKS[@]}" >&2
            exit 1
          fi
          for apk in "${APKS[@]}"; do
            actual="$("$AAPT" dump badging "$apk" | sed -n "s/^package: name='\\([^']*\\)'.*/\\1/p" | head -n 1)"
            if [ "$actual" != "$EXPECTED_PACKAGE" ]; then
              echo "Wrong application ID in $apk: $actual" >&2
              exit 1
            fi
            echo "Verified $apk: $actual"
          done
          du -h "${APKS[@]}"

      - name: Publish APK to GitHub Releases
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: tgtv-android-${{ github.run_number }}-${{ github.run_attempt }}
        run: |
          gh release create "$TAG_NAME" \
            build/app/outputs/flutter-apk/*.apk \
            --title "TGTV Android build #${GITHUB_RUN_NUMBER}" \
            --notes "Automated APK build from ${GITHUB_SHA} (run ${GITHUB_RUN_ID}, attempt ${GITHUB_RUN_ATTEMPT})." \
            --target "$GITHUB_SHA"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: tgtv-android-${{ github.sha }}
          path: build/app/outputs/flutter-apk/*.apk
          if-no-files-found: error
          retention-days: 14
