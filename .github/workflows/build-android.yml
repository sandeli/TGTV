name: Build Android APK

on:
  push:
    branches:
      - feature/import-category-menu

permissions:
  contents: write

jobs:
  build-android:
    name: Test and build Android APK
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - name: Check out feature branch
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter 3.19.6
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.19.6'
          cache: true

      - name: Resolve dependencies
        run: flutter pub get

      - name: Run tests
        run: flutter test

      - name: Analyze Dart code
        run: flutter analyze

      - name: Build release APK
        run: flutter build apk --release

      - name: Publish APK to GitHub Releases
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: htv-android-${{ github.run_number }}-${{ github.run_attempt }}
        run: |
          gh release create "$TAG_NAME" \
            build/app/outputs/flutter-apk/app-release.apk \
            --title "HTV Android build #${GITHUB_RUN_NUMBER}" \
            --notes "Automated APK build from ${GITHUB_SHA} (run ${GITHUB_RUN_ID}, attempt ${GITHUB_RUN_ATTEMPT})." \
            --target "$GITHUB_SHA"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: htv-android-${{ github.sha }}
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 14
