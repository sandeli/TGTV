name: video_player_example
description: Demonstrates how to use the video_player plugin.
publish_to: none
# 加号后为 build number，即 Android versionCode（flutter 构建时会写入 local.properties）
# 每次发布必须递增，否则商店拒收、用户无法覆盖安装
version: 1.6.0+617

environment:
  sdk: ^3.1.0
  # Flutter 3.22 起最低 Android 版本为 API 21；本项目需保持 Android 4.4/API 19。
  flutter: ">=3.13.0 <3.22.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  fijkplayer_ijkfix: ^0.0.11

  # 状态管理
  # get: ^4.6.6
  get_it: ^7.6.7
  mobx: ^2.3.3+1
  flutter_mobx: ^2.2.1+1

  # 工具
  xml: ^6.5.0
  collection: ^1.18.0
  json_annotation: ^4.8.1
  package_info_plus: ^4.2.0
  retry: ^3.1.2
  pretty_qr_code: ^3.3.0
    # 网络
  shelf: ^1.4.1
  shelf_router: ^1.1.4
  http: ^1.2.1
  # 日志
  talker_flutter: ^4.1.3
  # 数据存储
  shared_preferences: ^2.2.2
  # 界面适配
  flutter_screenutil: ^5.9.0
  # 国际化
  intl: ^0.18.1

  path_provider: ^2.1.4
  url_launcher: 6.2.2
dev_dependencies:
  build_runner: ^2.1.10
  flutter_test:
    sdk: flutter

flutter:
  uses-material-design: true
  # README 截图仅供文档展示，不打包到应用；应用运行时只需要局域网导入网页。
  assets:
    - assets/web/
